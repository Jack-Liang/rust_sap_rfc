[package]
name = "rust_sap_rfc_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 服务（client 模式）
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
# 二进制字段 Base64 编解码
base64 = "0.22"
# 结构化日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Server 模式：同步 HTTP 客户端（回调线程内调用）+ TOML 配置
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "0.8"
